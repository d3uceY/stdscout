name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      is_stable: ${{ steps.check.outputs.is_stable }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Validate stable release tag
        id: check
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_stable=true" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "is_stable=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

  build-windows-amd64:
    runs-on: windows-latest
    needs: validate-tag
    if: needs.validate-tag.outputs.is_stable == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # elm.json pins 0.19.3, so the compiler has to match.
      - name: Install Elm
        run: npm install --global elm@0.19.3-0

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0

      - name: Install NSIS
        run: choco install nsis -y

      - name: Add NSIS to PATH
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ChocolateyInstall\bin",
            "${env:ProgramFiles(x86)}\NSIS",
            "$env:ProgramFiles\NSIS"
          )
          foreach ($candidate in $candidates) {
            if (Test-Path $candidate) {
              Add-Content -Path $env:GITHUB_PATH -Value $candidate
              $env:PATH = "$candidate;$env:PATH"
            }
          }
          $makensis = Get-Command makensis -ErrorAction SilentlyContinue
          if (-not $makensis) {
            throw "makensis not found after NSIS installation"
          }
          Write-Host "Using makensis at $($makensis.Source)"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate bindings
        shell: bash
        run: wails3 generate bindings -f '-tags production' -clean=true -time-type=Date

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Test
        run: go test ./...

      # The .exe resource and the installer both carry the tag, so everything
      # Windows reports (Properties, Apps & Features) matches the top bar.
      - name: Stamp version into build assets
        shell: bash
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          sed -i -E \
            -e "s/(\"file_version\": \")[^\"]*(\")/\1${VERSION}\2/" \
            -e "s/(\"ProductVersion\": \")[^\"]*(\")/\1${VERSION}\2/" \
            build/windows/info.json
          sed -i -E \
            -e "s/(name=\"com\.d3ucey\.stdscout\" version=\")[^\"]*(\")/\1${VERSION}.0\2/" \
            build/windows/wails.exe.manifest

          grep -qF "\"file_version\": \"${VERSION}\"" build/windows/info.json
          grep -qF "name=\"com.d3ucey.stdscout\" version=\"${VERSION}.0\"" build/windows/wails.exe.manifest

      - name: Generate .syso resource
        working-directory: build
        shell: bash
        run: wails3 generate syso -arch amd64 -icon windows/icon.ico -manifest windows/wails.exe.manifest -info windows/info.json -out ../wails_windows_amd64.syso

      - name: Build Windows binary
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          mkdir -p dist bin
          go build -tags production -trimpath -buildvcs=false \
            -ldflags="-w -s -H windowsgui -X main.AppVersion=v${VERSION}" \
            -o dist/StdScout-windows-amd64.exe .
          rm -f wails_windows_amd64.syso

      - name: Fetch WebView2 bootstrapper
        run: wails3 generate webview2bootstrapper -dir build/windows/nsis

      # project.nsi resolves the binary and OutFile relative to its own folder,
      # and files it at ../../bin/stdscout-amd64-installer.exe.
      - name: Build NSIS installer
        shell: cmd
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: makensis -DARG_WAILS_AMD64_BINARY=..\..\..\dist\StdScout-windows-amd64.exe -DINFO_PRODUCTVERSION=%VERSION% build\windows\nsis\project.nsi

      - name: Collect artifacts
        shell: pwsh
        run: |
          Copy-Item bin\stdscout-amd64-installer.exe dist\StdScout-windows-amd64-installer.exe
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-windows-amd64
          path: dist/*

  cleanup-tag-on-failure:
    runs-on: ubuntu-latest
    needs:
      - build-windows-amd64
    if: always() && needs.build-windows-amd64.result == 'failure'
    permissions:
      contents: write
    steps:
      - name: Delete tag
        run: |
          git -c "http.extraHeader=Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            push origin --delete "${{ github.ref_name }}" || true

  release:
    runs-on: ubuntu-latest
    needs:
      - validate-tag
      - build-windows-amd64
    if: needs.validate-tag.outputs.is_stable == 'true'
    permissions:
      contents: write
    steps:
      - name: Write release body
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo '## Download'
            echo ''
            echo '| Platform | Link |'
            echo '|---|---|'
            echo "| Windows (portable) | [StdScout-windows-amd64.exe](https://github.com/${REPO}/releases/download/${TAG}/StdScout-windows-amd64.exe) |"
            echo "| Windows (installer) | [StdScout-windows-amd64-installer.exe](https://github.com/${REPO}/releases/download/${TAG}/StdScout-windows-amd64-installer.exe) |"
            echo ''
            echo 'SHA-256 checksums are in `SHA256SUMS.txt`.'
            echo ''
            echo '## First-Run Notes'
            echo ''
            echo "StdScout is unsigned, so Windows will warn on first launch — it's safe and open source."
            echo ''
            echo '**SmartScreen:** **More info** → **Run anyway** (or unblock the `.exe` in Properties).'
          } > release_body.md

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify release artifacts
        run: |
          test -f artifacts/StdScout-windows-amd64.exe
          test -f artifacts/StdScout-windows-amd64-installer.exe

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum StdScout-* > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          append_body: true
          body_path: release_body.md
          files: artifacts/*
